<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Islamic Scholars Archive{% endblock %}</title>

    <meta name="description" content="{% block meta_description %}Structured archive of Islamic scholars{% endblock %}">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                        Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 17px;
            line-height: 1.7;
            color: #212529;
            background-color: #f8f9fa;
        }

        h1, h2, h3, h4 {
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        p {
            margin-bottom: 1.2rem;
        }

        .navbar {
            background-color: #ffffff !important;
        }

        .card-title {
            font-weight: 600;
        }

        .scholar-card:hover {
            transform: translateY(-4px);
            transition: 0.2s ease;
        }

        .biography-content {
            max-width: 750px;
            margin: auto;
        }
        .text-justify {
             text-align: justify !important;
        }
</style>
</head>
<body>

<nav class="navbar navbar-light bg-light border-bottom">
    <div class="container">
        <a class="navbar-brand" href="/">Islamic Scholars Archive</a>
        <a class="nav-link" href="/scholars/">Scholars</a>
    </div>
</nav>
{% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}

<div class="container my-5">
    {% block content %}{% endblock %}
</div>
<footer class="border-top mt-5 py-4 bg-light">
    <div class="container text-center text-muted small">
        <p class="mb-1">
            © {% now "Y" %} Islamic Scholars Archive
        </p>
        <p class="mb-1">
            A structured and reviewed archive of classical Islamic scholarship.
        </p>
        <div>
            <a href="/scholars/" class="text-muted me-3 text-decoration-none">Scholars</a>
            <a href="/submit/" class="text-muted text-decoration-none">Submit</a>
        </div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
